name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/test.sh
  app:
    needs: test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/build-app.sh
      - name: verify distribution
        run: |
          mkdir -p /tmp/ipbar-check
          ditto -x -k dist/IPBar-macOS.zip /tmp/ipbar-check
          codesign --verify --strict --deep '/tmp/ipbar-check/IP Bar.app'
          architectures="$(lipo -archs '/tmp/ipbar-check/IP Bar.app/Contents/MacOS/IP Bar')"
          [[ " $architectures " == *' arm64 '* ]]
          [[ " $architectures " == *' x86_64 '* ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IPBar-macOS
          path: dist/IPBar-macOS.zip
          if-no-files-found: error
